# vpsmgr main nftables config — GENERATED by `vps install`.
# This file is re-applied on boot by vps-nft.service.
# Per-user DNAT rules live in /etc/vpsmgr/nftables.d/user-<name>.nft.
table inet vpsmgr {
  chain prerouting {
    type nat hook prerouting priority dstnat; policy accept;
  }

  chain output {
    type nat hook output priority dstnat; policy accept;
  }

  chain postrouting {
    type nat hook postrouting priority srcnat; policy accept;
    ip saddr 10.115.0.0/24 oifname "eth0" masquerade
  }
}
include "/etc/vpsmgr/nftables.d/*.nft"
